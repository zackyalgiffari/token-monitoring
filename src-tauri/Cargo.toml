[package]
name = "token-monitoring"
version = "0.1.0"
description = "Local Claude Code and Codex CLI token usage monitor"
authors = ["zackyalgiffari"]
edition = "2021"

[lib]
name = "token_monitoring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = { version = "6", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
anyhow = "1"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
